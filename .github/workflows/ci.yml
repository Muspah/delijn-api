name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # The live tests run only when the repository secrets are set (they are not exposed to fork PRs).
      - run: ./mvnw -B verify
        env:
          DELIJN_CORE_API_KEY: ${{ secrets.DELIJN_CORE_API_KEY }}
          DELIJN_SEARCH_API_KEY: ${{ secrets.DELIJN_SEARCH_API_KEY }}
